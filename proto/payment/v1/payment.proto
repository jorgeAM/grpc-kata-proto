syntax = "proto3";

option go_package = "github.com/jorgeAM/grpc-kata-proto/gen/go/payment/v1;payment";

message CreatePaymentRequest {
    string user_id = 1;
    string order_id = 2;
    float total_price = 3;
}

message CreatePaymentResponse {
    string payment_id = 1;
    int64 bill_id = 2;
}

service PaymentService {
    rpc Create(CreatePaymentRequest) returns (CreatePaymentResponse){}
}